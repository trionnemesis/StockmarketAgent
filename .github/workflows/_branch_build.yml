name: Temporary branch artifact builder

on:
  push:
    branches: [feat/tw-candidate-evidence-matrix]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build deterministic artifacts
        run: python3 -m src.pipeline build
      - name: Run all tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate repository
        run: python3 -m src.pipeline validate
      - name: Commit verified artifacts and remove this workflow
        run: |
          rm .github/workflows/_branch_build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publish Taiwan evidence matrix"
          git push origin "HEAD:${GITHUB_REF_NAME}"
