name: TW-C1 bootstrap

on:
  push:
    branches:
      - feat/tw-c1-revision-aware-data-layer
    paths:
      - tools/c1_runner.py
      - tools/c1_payload_*.txt
      - .github/workflows/c1-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: tw-c1-bootstrap
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/tw-c1-revision-aware-data-layer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply C1 implementation and bootstrap archive
        run: python3 tools/c1_runner.py

      - name: Commit executable C1 slice
        run: |
          git diff --check
          git add README.md TASKS.md config schemas src tests data/observations/twse
          git commit -m "feat: add revision-aware Taiwan observation layer"

      - name: Build generated artifacts
        run: python3 -m src.pipeline build

      - name: Run full test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate contracts and generated outputs
        run: python3 -m src.pipeline validate

      - name: Commit generated Pages and run artifacts
        run: |
          git diff --check
          git add docs reports signals agent-runs
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish TW-C1 archive and status artifacts"
          fi

      - name: Remove one-time bootstrap files
        run: |
          rm -f .github/workflows/c1-bootstrap.yml
          rm -f tools/c1_runner.py tools/c1_payload_*.txt
          rmdir tools 2>/dev/null || true
          git add -A
          git commit -m "chore: remove C1 bootstrap tooling"

      - name: Final verification after cleanup
        run: |
          python3 -m src.pipeline build
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m src.pipeline validate
          git diff --exit-code

      - name: Push completed branch
        run: git push origin HEAD:feat/tw-c1-revision-aware-data-layer
