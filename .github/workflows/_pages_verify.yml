name: Temporary public Pages verifier

on:
  push:
    branches: [feat/tw-candidate-evidence-matrix]

permissions:
  contents: write

jobs:
  verify-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout merged feature tree
        uses: actions/checkout@v6
      - name: Verify deployed Pages byte for byte
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = "https://trionnemesis.github.io/StockmarketAgent/"
          revision = "4f2f385e7da176b8821288b885c44fc14f496586"
          universe = json.loads(Path("config/universe.json").read_text(encoding="utf-8"))
          taiwan = [item for item in universe["instruments"] if item["country"] == "TW"]
          pairs = [
              ("markets/tw.html", Path("docs/markets/tw.html"), "text/html"),
              ("data/latest.json", Path("docs/data/latest.json"), "application/json"),
          ]
          for item in taiwan:
              pairs.append((
                  f"instruments/{item['slug']}.html",
                  Path("docs/instruments") / f"{item['slug']}.html",
                  "text/html",
              ))
              pairs.append((
                  f"data/observations/{item['slug']}.json",
                  Path("docs/data/observations") / f"{item['slug']}.json",
                  "application/json",
              ))

          last_error = None
          for attempt in range(12):
              try:
                  fetched = {}
                  for route, local_path, expected_type in pairs:
                      request = Request(
                          f"{base}{route}?revision={revision}",
                          headers={"User-Agent": "StockmarketAgent-Pages-Verification/1.0"},
                      )
                      with urlopen(request, timeout=20) as response:
                          payload = response.read()
                          content_type = response.headers.get_content_type()
                          assert response.status == 200, (route, response.status)
                          assert content_type == expected_type, (route, content_type)
                      expected = local_path.read_bytes()
                      assert payload == expected, (
                          route,
                          hashlib.sha256(payload).hexdigest(),
                          hashlib.sha256(expected).hexdigest(),
                      )
                      fetched[route] = payload
                  market = fetched["markets/tw.html"].decode("utf-8")
                  assert 'data-tw-observation-matrix="10"' in market
                  assert market.count('data-observation-matrix="') == 10
                  assert all(label in market for label in ("支持證據", "反向證據", "失效條件"))
                  for item in taiwan:
                      observation = json.loads(
                          fetched[f"data/observations/{item['slug']}.json"]
                      )
                      assert observation["used_in_signal"] is False
                      assert observation["evidence_assessment"]["used_in_signal"] is False
                      assert all(
                          observation["evidence_assessment"][field]
                          for field in (
                              "supporting_evidence",
                              "contrary_evidence",
                              "invalidation_conditions",
                          )
                      )
                  print(f"verified {len(pairs)} public routes; 10 matrix rows; byte-identical to merge {revision}")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 11:
                      raise
                  time.sleep(5)
          PY
      - name: Remove temporary verifier
        run: |
          rm .github/workflows/_pages_verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: verify deployed Taiwan evidence Pages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
