name: Human-readable Pages regeneration

on:
  push:
    branches:
      - feat/tw-c1-history-status
    paths:
      - .github/workflows/humanize-pages.yml
      - .github/humanize-pages-trigger.txt

permissions:
  contents: write

concurrency:
  group: humanize-pages-final
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/tw-c1-history-status

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebuild deterministic artifacts
        run: python3 -m src.pipeline build

      - name: Run complete test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate published contracts
        run: python3 -m src.pipeline validate

      - name: Commit generated outputs
        run: |
          git diff --check
          git add docs reports signals agent-runs
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish human-readable analysis UI"
          fi

      - name: Remove one-time regeneration workflow
        run: |
          rm -f .github/workflows/humanize-pages.yml .github/humanize-pages-trigger.txt
          git add -A .github
          git commit -m "chore: remove human-readable UI bootstrap"

      - name: Final verification
        run: |
          python3 -m src.pipeline build
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m src.pipeline validate
          git diff --exit-code
          git status --porcelain --untracked-files=all | tee "${RUNNER_TEMP}/repository-status.txt"
          test ! -s "${RUNNER_TEMP}/repository-status.txt"

      - name: Push completed branch
        run: git push origin HEAD:feat/tw-c1-history-status
