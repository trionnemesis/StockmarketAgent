name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebuild deterministic site
        run: python3 -m src.pipeline build
      - name: Run release tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ensure generated artifacts are committed
        run: |
          git diff --exit-code
          git status --porcelain --untracked-files=all | tee "${RUNNER_TEMP}/repository-status.txt"
          test ! -s "${RUNNER_TEMP}/repository-status.txt"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
